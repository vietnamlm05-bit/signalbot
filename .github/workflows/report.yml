name: signalbot-report
on:
  schedule:
    - cron: "30 1 * * *"     # 08:30 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalbot
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python report.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Lưu report.md
        run: |
          git config user.name "signalbot"
          git config user.email "signalbot@users.noreply.github.com"
          git add report.md
          git commit -m "report: $(date -u +%F)" || exit 0
          git push
