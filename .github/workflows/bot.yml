name: signalbot
on:
  schedule:
    - cron: "7 * * * *"      # mỗi giờ, phút thứ 7 (nến 1h đã đóng)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalbot           # không cho 2 lần chạy chồng nhau
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          EXCHANGE: ${{ vars.EXCHANGE || 'kraken' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Lưu paper.db
        if: always()
        run: |
          git config user.name "signalbot"
          git config user.email "signalbot@users.noreply.github.com"
          git add paper.db
          git commit -m "paper: $(date -u +%F_%H%M)" || exit 0
          git push
